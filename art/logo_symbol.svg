<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 프리미엄 그라디언트 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 배경 둥근 사각형 -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-opacity="0.3" />

  <!-- 동적 지도 타임라인 궤적 (Subtle Timeline Track) -->
  <path d="M 80 380 C 140 440, 220 340, 280 400 C 340 460, 420 380, 440 280" 
        fill="none" stroke="url(#accentCyan)" stroke-width="6" stroke-dasharray="12 12" stroke-opacity="0.4" />

  <!-- 고급스러운 모던 심볼: 타이포그래피 'F' 와 지도 핀(Map Pin) & 나침반의 유기적 결합 -->
  <g filter="url(#glow)" transform="translate(4, -4)">
    <!-- 핀의 우아한 바깥 곡선 (글꼴 곡선 모티브) -->
    <path d="M 256 90 
             C 170 90, 110 156, 110 240 
             C 110 320, 210 400, 256 438 
             C 302 400, 402 320, 402 240 
             C 402 156, 342 90, 256 90 Z" 
          fill="none" stroke="url(#primaryGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- 핀 내부의 기하학적 세리프 타이포 'F' (TypeCraft & Font) -->
    <!-- F 기둥 -->
    <path d="M 200 170 L 200 320" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" />
    <!-- F 상단 가로바 -->
    <path d="M 200 175 L 305 175" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" />
    <!-- F 중간 가로바 (타임라인 화살표 액센트) -->
    <path d="M 200 242 L 275 242" stroke="url(#accentCyan)" stroke-width="18" stroke-linecap="round" />
    
    <!-- GPS 타임라인 중심 펄스 링 (Pulse Radar) -->
    <circle cx="256" cy="240" r="88" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.5" />
    <circle cx="316" cy="175" r="10" fill="url(#roseAccent)" />
  </g>
</svg>
