<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bgGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="primaryGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="cyanAccentF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="roseDotF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="glowF" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="360" rx="36" fill="url(#bgGradFull)" />
  <rect width="1196" height="356" x="2" y="2" rx="34" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- 좌측 로고 심볼 그룹 -->
  <g transform="translate(40, 20)">
    <!-- 핀 아웃라인 -->
    <path d="M 160 50 
             C 105 50, 65 92, 65 150 
             C 65 210, 130 265, 160 290 
             C 190 265, 255 210, 255 150 
             C 255 92, 215 50, 160 50 Z" 
          fill="none" stroke="url(#primaryGradF)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- F 세리프/산세리프 하이브리드 바디 -->
    <path d="M 125 105 L 125 210" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" />
    <path d="M 125 110 L 195 110" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" />
    <path d="M 125 155 L 175 155" stroke="url(#cyanAccentF)" stroke-width="12" stroke-linecap="round" />
    
    <!-- 펄스 링 & GPS 닷 -->
    <circle cx="160" cy="150" r="60" fill="none" stroke="url(#primaryGradF)" stroke-width="2.5" stroke-opacity="0.4" />
    <circle cx="202" cy="110" r="7" fill="url(#roseDotF)" />
  </g>

  <!-- 우측 로고타입 (Typography Logotype) -->
  <g transform="translate(360, 205)">
    <!-- "FontCraft" 텍스트 -->
    <text font-family="system-ui, -apple-system, 'Inter', 'Pretendard', sans-serif" 
          font-weight="800" 
          font-size="96" 
          letter-spacing="-2" 
          fill="#FFFFFF">
      Font<tspan fill="url(#primaryGradF)">Craft</tspan>
    </text>
    
    <!-- 서브타이틀 슬로건 -->
    <text y="52" 
          font-family="system-ui, -apple-system, 'Inter', 'Pretendard', sans-serif" 
          font-weight="500" 
          font-size="22" 
          letter-spacing="6" 
          fill="#94A3B8">
      TIMELINE TRACKER &amp; SYSTEM TYPOGRAPHY
    </text>
  </g>

  <!-- 장식용 미세 벡터 그리드 라인 -->
  <line x1="360" y1="225" x2="1100" y2="225" stroke="#334155" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="1100" cy="225" r="4" fill="url(#cyanAccentF)" />
</svg>
